# Netlify configuration for Money Management App

[build]
  publish = "dist"
  command = "npm run build"

# Single Page App redirects
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for web app
[[headers]]
  for = "/*"
  [headers.values]
    # Enable modern browsers security features
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    
    # Referrer policy
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # CSP - adjust based on your needs
    Content-Security-Policy = "default-src 'self' https:; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://identitytoolkit.googleapis.com https://firestore.googleapis.com https://firebaseio.com https://*.firebasestorage.app;"
    
    # CORS for Firebase
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"

# Compress assets
[build.environment]
  NODE_ENV = "production"

# Cache configuration
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
